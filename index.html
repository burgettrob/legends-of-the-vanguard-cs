<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════════
  REDIRECT STUB — points visitors to the current version of the sheet.

  ▶ TO PUBLISH A NEW VERSION:
      1. Upload your new content file (e.g. index_50.html) to the repo.
      2. Change the version number in the THREE places marked
         "CHANGE THIS" below (from index_49.html to index_50.html).
      3. Upload this index.html.

  Because each content file has a brand-new filename, browsers and the
  GitHub Pages CDN can never serve a stale copy of it. Only this tiny
  stub is cached, and it refreshes within GitHub's ~10-minute window.
  ════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Keep the stub itself from being cached aggressively -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- CHANGE THIS (1 of 3): meta-refresh fallback for when JS is disabled -->
  <meta http-equiv="refresh" content="0; url=index_49.html">
  <title>Legends of the Vanguard — Character Codex</title>
  <style>
    html, body { margin: 0; height: 100%; background: #141414; color: #e8e6e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
    .spinner { width: 28px; height: 28px; border: 3px solid #3a3a3a;
      border-top-color: #c8a04e; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #c8a04e; }
    .muted { color: #8a8780; font-size: 13px; }
  </style>
  <script>
    // CHANGE THIS (2 of 3): instant JS redirect.
    // Using location.replace so the stub doesn't pollute browser history /
    // back-button behaviour. The ?_ cache-buster guarantees a fresh fetch
    // of the content file even on the most stubborn cache.
    (function () {
      var TARGET = "index_49.html";
      window.location.replace(TARGET + "?_=" + Date.now());
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div>Loading the latest version…</div>
    <!-- CHANGE THIS (3 of 3): manual fallback link -->
    <div class="muted">If you are not redirected automatically,
      <a href="index_49.html">click here to open the character sheet</a>.</div>
  </div>
</body>
</html>
