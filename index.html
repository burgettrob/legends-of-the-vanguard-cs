<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════════
  SELF-UPDATING REDIRECT STUB

  ▶ You should NOT need to edit this file again.

  To publish a new version:
    1. Upload the new content file (e.g. csheet_v_2_0_2.html).
    2. Change the "sheet" value in version.json to that filename.
  That's it — no edits here.

  WHY THIS FIXES STALE CACHES:
  Browsers cache index.html using GitHub's HTTP headers (~10 min TTL),
  and the old <meta http-equiv="Cache-Control"> tags did nothing about
  that. This stub carries NO version info of its own — it fetches
  version.json fresh on every load (unique query string + no-store), so
  even a long-stale cached copy of this file still finds the newest
  sheet. The FALLBACK below only matters if version.json can't be
  fetched at all (offline, typo, etc.).
  ════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Legends of the Vanguard — Character Codex</title>
  <style>
    html, body { margin: 0; height: 100%; background: #141414; color: #e8e6e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
    .spinner { width: 28px; height: 28px; border: 3px solid #3a3a3a;
      border-top-color: #c8a04e; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #c8a04e; }
    .muted { color: #8a8780; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div>Loading the latest version…</div>
    <div class="muted" id="fallback-note" style="display:none;">
      Taking longer than expected —
      <a id="fallback-link" href="#">click here to open the character sheet</a>.
    </div>
  </div>
  <script>
    (function () {
      // Safety net used ONLY if version.json can't be loaded. Normal releases
      // never touch this — they just edit version.json.
      var FALLBACK = "csheet_v_2_0_1.html";

      function go(target) {
        // Cache-buster on the content file too (belt-and-suspenders; content
        // files are already uniquely named so this is just insurance).
        window.location.replace(target + "?_=" + Date.now());
      }

      // If we haven't redirected within a few seconds, surface a manual link
      // so no one is ever stuck on the spinner.
      var timer = setTimeout(function () {
        var note = document.getElementById('fallback-note');
        var link = document.getElementById('fallback-link');
        if (link) link.href = FALLBACK + "?_=" + Date.now();
        if (note) note.style.display = 'block';
      }, 4000);

      fetch("version.json?_=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          clearTimeout(timer);
          go((data && data.sheet) ? data.sheet : FALLBACK);
        })
        .catch(function () {
          clearTimeout(timer);
          go(FALLBACK);
        });
    })();
  </script>
</body>
</html>
