<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legends of the Vanguard — Party Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0f1a; --bg2:#13172a; --bg3:#1a1f38; --bg4:#222844;
  --border:#2a3060; --border2:#3a4480;
  --accent:#5b7fff; --accent2:#8fa8ff;
  --gold:#d4a843; --gold2:#f0cc6a;
  --red:#e05555; --green:#4caf7d; --teal:#3dccc7;
  --purple:#a87fff; --orange:#f09050;
  --text:#dde3ff; --text2:#8896cc; --text3:#5566aa;
  --font-head:'Cinzel',serif;
  --font-body:'Crimson Pro',serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:15px;
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 20% 20%,rgba(91,127,255,.06) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 80%,rgba(168,127,255,.05) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}
.app{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding:0 16px 40px;}

/* ── HEADER ── */
.header{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:20px 0 16px;
  border-bottom:1px solid var(--border);margin-bottom:0;
}
.header-title{
  font-family:var(--font-head);font-size:26px;
  letter-spacing:.12em;color:var(--gold);
  text-shadow:0 0 30px rgba(212,168,67,.35);text-align:center;
}
.header-sub{
  font-size:11px;color:var(--text3);letter-spacing:.1em;
  text-align:center;margin-top:3px;text-transform:uppercase;
  font-family:var(--font-mono);
}

/* ── TOP TABS ── */
.top-tabs{
  display:flex;gap:4px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  padding-top:12px;margin-bottom:20px;
}
.top-tab{
  font-family:var(--font-head);font-size:11px;letter-spacing:.08em;
  padding:8px 18px;background:transparent;
  border:1px solid transparent;border-bottom:none;
  color:var(--text3);cursor:pointer;transition:all .2s;
  border-radius:4px 4px 0 0;white-space:nowrap;
}
.top-tab:hover{color:var(--text2);border-color:var(--border);}
.top-tab.active{
  color:var(--gold);border-color:var(--border);
  background:var(--bg2);border-bottom:1px solid var(--bg2);
  margin-bottom:-1px;
}

/* ── PANELS ── */
.panel{display:none;}
.panel.active{display:block;}

/* ── BUTTONS ── */
.btn{
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:5px;color:var(--text2);cursor:pointer;
  font-family:var(--font-head);font-size:11px;letter-spacing:.06em;
  padding:7px 16px;transition:all .2s;
}
.btn:hover{background:var(--accent);border-color:var(--accent);color:white;}
.btn.gold{border-color:var(--gold);color:var(--gold);}
.btn.gold:hover{background:var(--gold);color:var(--bg);}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red);color:white;}
.btn.sm{padding:4px 10px;font-size:10px;}

/* ── PARTY OVERVIEW GRID ── */
.party-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:16px;margin-bottom:24px;
}
.party-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;transition:border-color .2s;
  display:flex;flex-direction:column;
}
.party-card:hover{border-color:var(--border2);}
.party-card-header{
  padding:12px 16px;display:flex;align-items:center;
  gap:10px;border-bottom:1px solid var(--border);
}
.party-card-name{
  font-family:var(--font-head);font-size:15px;color:var(--gold);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.party-card-body{padding:12px 16px;display:flex;flex-direction:column;gap:10px;flex:1;}
.vital-row{display:flex;justify-content:space-between;align-items:center;}
.vital-label{font-size:11px;color:var(--text3);font-family:var(--font-mono);letter-spacing:.05em;}
.vital-val{font-family:var(--font-mono);font-size:14px;font-weight:500;}
.vital-val.hp{color:var(--red);}
.vital-val.lvl{color:var(--gold);}
.hp-bar-bg{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:3px;}
.hp-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
.ailment-tags{display:flex;flex-wrap:wrap;gap:4px;min-height:22px;}
.mini-tag{
  font-size:10px;font-family:var(--font-mono);padding:2px 8px;
  border-radius:10px;background:rgba(224,85,85,.15);
  border:1px solid rgba(224,85,85,.3);color:var(--red);
}
.mini-tag.ex{
  background:rgba(240,144,80,.15);
  border-color:rgba(240,144,80,.3);color:var(--orange);
}
.go-btn{
  display:block;width:100%;padding:8px;background:var(--bg3);
  border:none;border-top:1px solid var(--border);
  color:var(--accent);font-family:var(--font-head);
  font-size:10px;letter-spacing:.1em;cursor:pointer;
  transition:all .2s;text-align:center;
}
.go-btn:hover{background:var(--accent);color:white;}
.class-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* ── ADD CHARACTER CARD ── */
.add-char-card{
  background:var(--bg2);border:2px dashed var(--border);
  border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  min-height:220px;cursor:pointer;transition:all .2s;padding:20px;
}
.add-char-card:hover{border-color:var(--accent);background:var(--bg3);}
.add-char-card .plus{font-size:36px;color:var(--text3);line-height:1;}
.add-char-card .lbl{font-family:var(--font-head);font-size:11px;color:var(--text3);letter-spacing:.1em;}

/* ── CHARACTER SHEET FRAME ── */
.char-frame-bar{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--bg2);border:1px solid var(--border);
  border-bottom:none;border-radius:8px 8px 0 0;
  flex-wrap:wrap;margin-top:4px;
}
.char-frame-bar .char-name-lbl{
  font-family:var(--font-head);font-size:13px;color:var(--gold);flex:1;
}
.char-iframe{
  width:100%;border:1px solid var(--border);
  border-radius:0 0 8px 8px;
  height:calc(100vh - 160px);
  min-height:600px;
  display:block;
  background:var(--bg);
}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  z-index:1000;display:flex;align-items:center;justify-content:center;
}
.modal{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:12px;padding:28px;min-width:340px;max-width:460px;width:90%;
}
.modal h3{
  font-family:var(--font-head);color:var(--gold);
  font-size:16px;margin-bottom:18px;letter-spacing:.06em;
}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
.field label{font-size:10px;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;}
.field input,.field select{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:4px;color:var(--text);
  font-family:var(--font-body);font-size:14px;
  padding:7px 10px;width:100%;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
select option{background:var(--bg3);}

/* ── SAVE BANNER ── */
#save-banner{
  position:fixed;bottom:24px;right:24px;
  background:var(--bg3);border:1px solid var(--green);
  border-radius:8px;padding:10px 18px;
  color:var(--green);font-family:var(--font-mono);font-size:12px;
  z-index:9999;transition:opacity .4s;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  display:none;
}

/* ── SUMMARY BAR ── */
.summary-bar{
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  padding:10px 16px;background:var(--bg2);
  border:1px solid var(--border);border-radius:8px;
  margin-bottom:20px;
}
.summary-stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.summary-stat .s-val{font-family:var(--font-head);font-size:18px;color:var(--gold);}
.summary-stat .s-lbl{font-size:9px;color:var(--text3);font-family:var(--font-mono);letter-spacing:.05em;text-transform:uppercase;}
.summary-divider{width:1px;height:36px;background:var(--border);flex-shrink:0;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<div class="header">
  <div></div>
  <div>
    <div class="header-title">Legends of the Vanguard</div>
    <div class="header-sub">Party Manager</div>
  </div>
  <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;">
    <button class="btn gold sm" onclick="savePartyData()">💾 Save Party</button>
    <label class="btn sm" style="cursor:pointer;margin:0;">
      📂 Load Party
      <input type="file" accept=".json" onchange="loadPartyData(event)" style="display:none;">
    </label>
  </div>
</div>

<!-- TOP TABS -->
<div class="top-tabs" id="top-tabs">
  <button class="top-tab active" data-target="overview" onclick="showTopTab('overview',this)">
    ⚔ Party Overview
  </button>
  <!-- Character tabs injected here -->
</div>

<!-- OVERVIEW PANEL -->
<div id="panel-overview" class="panel active">

  <!-- Summary bar -->
  <div class="summary-bar" id="summary-bar">
    <div class="summary-stat">
      <span class="s-val" id="sum-chars">0</span>
      <span class="s-lbl">Characters</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <span class="s-val" id="sum-alive" style="color:var(--green);">0</span>
      <span class="s-lbl">Active</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <span class="s-val" id="sum-ailments" style="color:var(--red);">0</span>
      <span class="s-lbl">Ailments</span>
    </div>
    <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn sm gold" onclick="syncAll()">↻ Sync All Sheets</button>
    </div>
  </div>

  <!-- Party grid -->
  <div class="party-grid" id="party-grid">
    <div class="add-char-card" id="add-card" onclick="openAddModal()">
      <div class="plus">+</div>
      <div class="lbl">Add Character</div>
      <div style="font-size:11px;color:var(--text3);font-family:var(--font-mono);">0 / 6</div>
    </div>
  </div>

</div>
<!-- /overview panel -->

<!-- Character sheet panels injected by JS -->

</div><!-- /app -->

<!-- ADD CHARACTER MODAL -->
<div id="add-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>Add Character</h3>
    <div class="field">
      <label>Character Name</label>
      <input type="text" id="new-name" placeholder="Enter character name…" maxlength="40"
        onkeydown="if(event.key==='Enter')addCharacter()">
    </div>
    <div class="field">
      <label>Player Name</label>
      <input type="text" id="new-player" placeholder="Player's name (optional)…" maxlength="40"
        onkeydown="if(event.key==='Enter')addCharacter()">
    </div>
    <div class="field">
      <label>Role</label>
      <select id="new-role">
        <option value="player">Player</option>
        <option value="gm">Game Master</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn gold" onclick="addCharacter()">Create Character</button>
    </div>
  </div>
</div>

<!-- SAVE BANNER -->
<div id="save-banner"></div>

<script>
// ════════════════════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════════════════════

const CLASS_COLORS = {
  Archer:'#3dccc7', Cleric:'#c8a8e0', Druid:'#7ec86e',
  Pugilist:'#f09050', Mage:'#5b7fff', Paladin:'#f0cc6a',
  Rogue:'#a87fff', Shaman:'#40c8a0', Sorcerer:'#e05555',
  Warlord:'#ff8060', Warrior:'#7890c0',
};

const RESOURCE_COLORS = {
  Mana:'#6090ff', Rage:'#e05555', Stamina:'#3dccc7',
};

const XP_TABLE = [0,300,900,2100,3900,6500,11000,17500,25000,34000,45000,60000,
                  80000,102000,128000,158000,192000,230000,275000,330000];

function getLevel(xp) {
  for (let i = XP_TABLE.length - 1; i >= 0; i--) {
    if (xp >= XP_TABLE[i]) return i + 1;
  }
  return 1;
}

// All ailment names from the sheet (used for sync)
const ALL_AILMENT_NAMES = [
  'Acid','Atrophy','Disarmed','Blind','Muted','Incapacitated','Stagger',
  'Grappled','Restrained','Knocked Back','Knocked Down','Open Wound',
  'Gushing Wound','Slowed','Rooted','Stun','Fear','Taunt','Fearful',
  'Terror','Sleep','Madness','Confused','Charm','Burn','Ignited','Shock',
  'Paralyzed','Frost','Frozen','Wet','Oiled','Petrification','Diseased',
  'Contagion','Poison','Venom','Wither','Rot','Decay','Void Sickness',
  'Soul Crack','Shadow Mark','Weakened','Soul Sickness',
];

// ════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════

let party  = [];   // array of character objects
let charId = 0;    // incrementing ID counter

// character object shape:
// { id, name, player, role, overview: { hp, maxHp, resource, resourceName, level, cls, spec, ailments, exhaustion, xp, temphp, pylCharges } }

// ════════════════════════════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════════════════════════════

function openAddModal() {
  if (party.length >= 6) { showBanner('Party is full (6/6)!'); return; }
  document.getElementById('add-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('new-name').focus(), 50);
}

function closeModal() {
  document.getElementById('add-modal').style.display = 'none';
  document.getElementById('new-name').value   = '';
  document.getElementById('new-player').value = '';
  document.getElementById('new-role').value   = 'player';
}

function addCharacter() {
  const name   = (document.getElementById('new-name').value   || '').trim() || 'Unnamed Hero';
  const player = (document.getElementById('new-player').value || '').trim();
  const role   = document.getElementById('new-role').value;
  const id     = 'c' + (++charId);

  party.push({
    id, name, player, role,
    overview: {
      hp:0, maxHp:0, resource:0, resourceName:'Resource',
      level:1, cls:'', spec:'', ailments:[], exhaustion:0,
      xp:0, temphp:0, pylCharges:[false,false],
    },
  });

  closeModal();
  renderAll();

  // Auto-open the new character's sheet tab
  const tab = document.querySelector(`.top-tab[data-id="${id}"]`);
  if (tab) showTopTab('sheet-' + id, tab);
}

function removeCharacter(id) {
  if (!confirm('Remove this character? Their sheet will be lost unless already saved.')) return;
  party = party.filter(c => c.id !== id);

  // Remove tab
  const tab = document.querySelector(`.top-tab[data-id="${id}"]`);
  if (tab) tab.remove();

  // Remove panel
  const panel = document.getElementById('panel-sheet-' + id);
  if (panel) panel.remove();

  // Go back to overview
  const overviewTab = document.querySelector('.top-tab[data-target="overview"]');
  showTopTab('overview', overviewTab);

  renderAll();
}

// ════════════════════════════════════════════════════════════════════
// RENDERING
// ════════════════════════════════════════════════════════════════════

function renderAll() {
  renderOverviewCards();
  ensureCharPanels();
  updateSummaryBar();
  updateAddCard();
}

function updateAddCard() {
  const card = document.getElementById('add-card');
  if (!card) return;
  card.style.display = party.length >= 6 ? 'none' : '';
  const countEl = card.querySelector('div:last-child');
  if (countEl) countEl.textContent = party.length + ' / 6';
}

function updateSummaryBar() {
  const total    = party.length;
  const alive    = party.filter(c => (c.overview.hp || 0) > 0 || c.overview.maxHp === 0).length;
  const ailCount = party.reduce((sum, c) => sum + (c.overview.ailments || []).length + (c.overview.exhaustion > 0 ? 1 : 0), 0);
  document.getElementById('sum-chars').textContent   = total;
  document.getElementById('sum-alive').textContent   = alive;
  document.getElementById('sum-ailments').textContent = ailCount;
}

function renderOverviewCards() {
  const grid = document.getElementById('party-grid');
  // Remove old cards (keep add-card)
  grid.querySelectorAll('.party-card').forEach(c => c.remove());
  // Re-insert cards before the add card
  const addCard = document.getElementById('add-card');
  party.forEach(char => {
    const card = buildOverviewCard(char);
    grid.insertBefore(card, addCard);
  });
}

function buildOverviewCard(char) {
  const ov  = char.overview || {};
  const cls = ov.cls || '';
  const dotColor = cls && CLASS_COLORS[cls] ? CLASS_COLORS[cls] : 'var(--text3)';

  const hp    = ov.hp    || 0;
  const maxHp = ov.maxHp || 0;
  const hpPct = maxHp > 0 ? Math.min(100, Math.round(hp / maxHp * 100)) : 0;
  const hpColor = hpPct > 60 ? 'var(--green)' : hpPct > 30 ? 'var(--orange)' : 'var(--red)';

  const res     = ov.resource     || 0;
  const resName = ov.resourceName || 'Resource';
  const resColor = RESOURCE_COLORS[resName] || 'var(--text)';
  const lvl = getLevel(ov.xp || 0);

  // PYL pips
  const pylHtml = (ov.pylCharges || [false,false]).map((charged,i) =>
    `<span style="font-size:14px;color:${charged ? 'var(--gold)' : 'var(--text3)'};">${charged ? '◆' : '◇'}</span>`
  ).join(' ');

  // Ailment tags
  const exHtml   = ov.exhaustion > 0
    ? `<span class="mini-tag ex">Exhaustion ${ov.exhaustion}</span>` : '';
  const ails     = (ov.ailments || []);
  const ailHtml  = ails.length > 0
    ? ails.map(a => `<span class="mini-tag">${a}</span>`).join('')
    : (!ov.exhaustion ? '<span style="font-size:11px;color:var(--text3);font-family:var(--font-mono);">None</span>' : '');

  const card = document.createElement('div');
  card.className = 'party-card';
  card.id = 'overview-card-' + char.id;

  card.innerHTML = `
    <div class="party-card-header">
      <div class="class-dot" style="background:${dotColor};"></div>
      <div class="party-card-name" title="${escHtml(char.name)}">${escHtml(char.name)}</div>
      ${char.player ? `<span style="font-size:10px;color:var(--text3);font-family:var(--font-mono);">${escHtml(char.player)}</span>` : ''}
      <span style="color:var(--text3);cursor:pointer;font-size:14px;padding:2px 4px;margin-left:4px;"
        onclick="removeCharacter('${char.id}')" title="Remove character">✕</span>
    </div>
    <div class="party-card-body">

      <div class="vital-row">
        <span class="vital-label">${escHtml(cls || 'No Class')}${ov.spec ? ' · ' + escHtml(ov.spec) : ''}</span>
        <span class="vital-val lvl">Lv ${lvl}</span>
      </div>

      <div>
        <div class="vital-row">
          <span class="vital-label">HP</span>
          <span class="vital-val" style="color:${hpColor};">${hp}${maxHp > 0 ? ' / ' + maxHp : ''} <span style="font-size:11px;color:var(--text3);">(+${ov.temphp||0} tmp)</span></span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill" style="width:${hpPct}%;background:${hpColor};"></div>
        </div>
      </div>

      <div class="vital-row">
        <span class="vital-label">${escHtml(resName)}</span>
        <span class="vital-val" style="color:${resColor};">${res}</span>
      </div>

      <div class="vital-row">
        <span class="vital-label">Press Your Luck</span>
        <span style="font-family:var(--font-mono);font-size:14px;">${pylHtml}</span>
      </div>

      <div>
        <div class="vital-label" style="margin-bottom:5px;">Ailments / Conditions</div>
        <div class="ailment-tags">${exHtml}${ailHtml}</div>
      </div>

    </div>
    <button class="go-btn" onclick="goToSheet('${char.id}')">OPEN CHARACTER SHEET ▶</button>
  `;
  return card;
}

// ════════════════════════════════════════════════════════════════════
// CHARACTER SHEET PANELS (iframes pointing to ./index.html)
// ════════════════════════════════════════════════════════════════════

function ensureCharPanels() {
  party.forEach(char => {
    // ── Tab ──────────────────────────────────────────────────────
    if (!document.querySelector(`.top-tab[data-id="${char.id}"]`)) {
      const tab = document.createElement('button');
      tab.className   = 'top-tab';
      tab.dataset.id  = char.id;
      tab.dataset.target = 'sheet-' + char.id;
      const label = char.name.length > 14 ? char.name.slice(0, 12) + '…' : char.name;
      tab.textContent = label;
      tab.onclick = function() { showTopTab('sheet-' + char.id, this); };
      document.getElementById('top-tabs').appendChild(tab);
    }

    // ── Panel ─────────────────────────────────────────────────────
    if (!document.getElementById('panel-sheet-' + char.id)) {
      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.id = 'panel-sheet-' + char.id;
      panel.innerHTML = buildSheetPanelHTML(char);
      document.querySelector('.app').appendChild(panel);
    }
  });
}

function buildSheetPanelHTML(char) {
  return `
    <div class="char-frame-bar">
      <div class="char-name-lbl">
        ${escHtml(char.name)}${char.player ? ' <span style="color:var(--text3);font-size:11px;">— ' + escHtml(char.player) + '</span>' : ''}
      </div>
      <button class="btn sm" onclick="syncSheet('${char.id}')" title="Pull current HP, resources, and ailments from the sheet into the party overview">↻ Sync to Overview</button>
      <button class="btn sm gold" onclick="triggerSheetSave('${char.id}')">💾 Save Sheet</button>
      <label class="btn sm" style="cursor:pointer;margin:0;" title="Load a previously saved character JSON into this sheet">
        📂 Load Sheet
        <input type="file" accept=".json" onchange="triggerSheetLoad(event,'${char.id}')" style="display:none;">
      </label>
    </div>
    <iframe
      id="iframe-${char.id}"
      class="char-iframe"
      src="./index.html"
      title="Character sheet for ${escHtml(char.name)}"
      onload="onIframeLoad('${char.id}')">
    </iframe>`;
}

function onIframeLoad(id) {
  // After the iframe loads, inject the loadCharacterFromString helper
  // so we can programmatically load a saved JSON into it.
  const w = getIframeWindow(id);
  if (!w) return;

  if (!w.loadCharacterFromString) {
    w.loadCharacterFromString = function(jsonStr) {
      try {
        const data = JSON.parse(jsonStr);
        if (!data.state || !data.fields) throw new Error('Invalid save file format.');
        const s = data.state;

        // Restore state properties
        const stateKeys = [
          'baseStats','skillPM','skillPointHistory','lockedLevels',
          'gearStats','professions','buffStatTotals',
          'inventoryGearModBufStats','deathSaves','deathFails',
          'pylCharges','vitalHP','vitalTempHP','vitalStamina',
          'multiclasses','mainClassLevel','chiCurrent','strandsCurrent',
          'bloodChargesCurrent','comboDiceCurrent','furyChargesCurrent',
          'skeletonChargesCurrent','soulFragmentsCurrent','battlemageFuryCurrent',
        ];
        stateKeys.forEach(key => {
          if (s[key] === undefined) return;
          if (key === 'lockedLevels') {
            w.state[key] = new Set(s[key]);
          } else if (typeof s[key] === 'object' && s[key] !== null && !Array.isArray(s[key]) && typeof w.state[key] === 'object') {
            Object.assign(w.state[key], s[key]);
          } else {
            w.state[key] = s[key];
          }
        });

        // Restore theme
        if (data.theme !== undefined) {
          w.document.documentElement.setAttribute('data-theme', data.theme);
          const sel = w.document.getElementById('theme-select');
          if (sel) sel.value = data.theme;
        }

        // Restore form fields
        Object.entries(data.fields).forEach(([fid, val]) => {
          const el = w.document.getElementById(fid);
          if (!el) return;
          if (el.type === 'checkbox') el.checked = val;
          else el.value = val;
        });

        // Rebuild dynamic sections
        w.buildEquipTable();
        w.buildSkillTables();
        w.buildAbuffTable();
        w.rebuildProfTable();
        w.buildAilmentGrid();
        w.buildResistGrid();
        w.buildShapeshiftTables && w.buildShapeshiftTables();

        // Restore visual pips
        if (w.state.deathSaves) w.state.deathSaves.forEach((v,i) => { const el=w.document.getElementById('ds'+i); if(el) el.classList.toggle('filled',v); });
        if (w.state.deathFails)  w.state.deathFails.forEach((v,i)  => { const el=w.document.getElementById('df'+i); if(el) el.classList.toggle('filled',v); });
        w.syncMortalityToDeathFails && w.syncMortalityToDeathFails();

        if (w.state.pylCharges) {
          w.state.pylCharges.forEach((v,i) => { if (v) w.togglePYL(i); });
        }

        w.recalc();
        w.initCollapsibleCards && w.initCollapsibleCards();
      } catch(err) {
        alert('Failed to load character: ' + err.message);
      }
    };
  }
}

// ════════════════════════════════════════════════════════════════════
// SYNC
// ════════════════════════════════════════════════════════════════════

function syncSheet(id) {
  const w    = getIframeWindow(id);
  const char = party.find(c => c.id === id);
  if (!w || !char) { showBanner('⚠ Sheet not loaded yet — open the tab first'); return; }

  try {
    const doc = w.document;
    const s   = w.state || {};

    // Basic identity
    const xp  = parseInt(doc.getElementById('inp-xp')?.value) || 0;
    const cls = doc.getElementById('sel-class')?.value  || '';
    const spec = doc.getElementById('sel-spec')?.value  || '';

    // HP — current and "max" (we store current as both since max HP is managed manually)
    const hp     = s.vitalHP    || 0;
    const temphp = s.vitalTempHP || 0;
    // Try to read displayed HP for max (the vitals strip shows current, not max)
    // Sheet doesn't separately track max HP — we use vitalHP as current
    // If they want a max, they can set it manually; for now maxHp = hp when syncing fresh
    const maxHp = hp; // same as current; overview bar will be full — this is by design

    // Resource
    const resource = s.vitalStamina || 0;
    let resourceName = 'Resource';
    const clsData = w.CLASS_DATA ? w.CLASS_DATA[cls] : null;
    if (clsData) resourceName = clsData.resource || 'Resource';

    // PYL charges
    const pylCharges = [...(s.pylCharges || [false, false])];

    // Exhaustion
    const exhaustion = parseInt(doc.getElementById('cg-exhaustion')?.value) || 0;

    // Active ailments — read checkboxes
    const ailments = [];
    ALL_AILMENT_NAMES.forEach(name => {
      const maxStacks = 10; // generous upper bound
      for (let st = 1; st <= maxStacks; st++) {
        const cb = doc.getElementById('ailment-' + name + '-' + st);
        if (!cb) break;
        if (cb.checked) {
          ailments.push(name + (st > 1 ? ' (' + st + ')' : ''));
          break;
        }
      }
    });

    char.overview = { hp, maxHp, temphp, resource, resourceName, level: getLevel(xp), cls, spec, ailments, exhaustion, xp, pylCharges };
    char.name = (doc.getElementById('banner-name')?.textContent?.trim()) || char.name;

    renderOverviewCards();
    updateSummaryBar();

    // Update tab label if name changed
    const tab = document.querySelector(`.top-tab[data-id="${id}"]`);
    if (tab) tab.textContent = char.name.length > 14 ? char.name.slice(0,12) + '…' : char.name;

    showBanner('✓ Synced ' + char.name);
  } catch(e) {
    showBanner('⚠ Sync failed: ' + e.message);
    console.error(e);
  }
}

function syncAll() {
  let synced = 0;
  party.forEach(char => {
    const w = getIframeWindow(char.id);
    if (w && w.state) { syncSheet(char.id); synced++; }
  });
  if (synced === 0) showBanner('⚠ No sheets loaded yet — open each character tab first');
  else showBanner('✓ Synced ' + synced + ' character' + (synced !== 1 ? 's' : ''));
}

// ════════════════════════════════════════════════════════════════════
// SAVE / LOAD SHEET (via iframe's own save/load functions)
// ════════════════════════════════════════════════════════════════════

function triggerSheetSave(id) {
  const w = getIframeWindow(id);
  if (!w) { showBanner('⚠ Sheet not loaded yet'); return; }
  try {
    w.saveCharacter();
  } catch(e) {
    showBanner('⚠ Save failed: ' + e.message);
  }
}

function triggerSheetLoad(event, id) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const w = getIframeWindow(id);
    if (!w) { showBanner('⚠ Sheet not loaded yet — open the tab first'); return; }
    if (!w.loadCharacterFromString) {
      // inject helper if iframe reloaded
      onIframeLoad(id);
      setTimeout(() => {
        if (w.loadCharacterFromString) {
          w.loadCharacterFromString(e.target.result);
          setTimeout(() => syncSheet(id), 600);
        }
      }, 300);
    } else {
      w.loadCharacterFromString(e.target.result);
      setTimeout(() => syncSheet(id), 600);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ════════════════════════════════════════════════════════════════════
// PARTY SAVE / LOAD (overview data only — sheets are saved separately)
// ════════════════════════════════════════════════════════════════════

function savePartyData() {
  const data = {
    version: 1,
    savedAt: new Date().toISOString(),
    charIdCounter: charId,
    party: party.map(c => ({
      id:       c.id,
      name:     c.name,
      player:   c.player,
      role:     c.role,
      overview: c.overview,
    })),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'lov_party_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showBanner('✓ Party overview saved');
}

function loadPartyData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.party) throw new Error('Invalid party file');

      // Remove existing character tabs and panels
      party.forEach(c => {
        const tab   = document.querySelector(`.top-tab[data-id="${c.id}"]`);
        const panel = document.getElementById('panel-sheet-' + c.id);
        if (tab)   tab.remove();
        if (panel) panel.remove();
      });

      party   = data.party;
      charId  = data.charIdCounter || Math.max(...party.map(c => parseInt(c.id.replace('c','')) || 0), 0);
      renderAll();
      showBanner('✓ Party loaded — ' + party.length + ' character' + (party.length !== 1 ? 's' : ''));
    } catch(err) {
      showBanner('⚠ Load failed: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ════════════════════════════════════════════════════════════════════
// TAB NAVIGATION
// ════════════════════════════════════════════════════════════════════

function showTopTab(target, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.top-tab').forEach(t => t.classList.remove('active'));

  const panelId = target === 'overview' ? 'panel-overview' : 'panel-' + target;
  const panel   = document.getElementById(panelId);
  if (panel) panel.classList.add('active');
  if (btn)   btn.classList.add('active');
}

function goToSheet(id) {
  const tab = document.querySelector(`.top-tab[data-id="${id}"]`);
  if (tab) showTopTab('sheet-' + id, tab);
}

// ════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════

function getIframeWindow(id) {
  const iframe = document.getElementById('iframe-' + id);
  if (!iframe) return null;
  try { return iframe.contentWindow; }
  catch(e) { return null; }
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showBanner(msg) {
  const b = document.getElementById('save-banner');
  b.textContent  = msg;
  b.style.display   = 'block';
  b.style.opacity   = '1';
  b.style.borderColor = msg.startsWith('⚠') ? 'var(--orange)' : msg.startsWith('✓') ? 'var(--green)' : 'var(--accent)';
  b.style.color      = msg.startsWith('⚠') ? 'var(--orange)' : msg.startsWith('✓') ? 'var(--green)' : 'var(--accent)';
  clearTimeout(b._timer);
  b._timer = setTimeout(() => {
    b.style.opacity = '0';
    setTimeout(() => b.style.display = 'none', 400);
  }, 3200);
}

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════

// Wire overview tab's data-target attribute
document.querySelector('.top-tab').dataset.target = 'overview';

// Initial render
renderAll();
</script>
